<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lộc Ấn Điều Hành</title>
<meta name="theme-color" content="#8E2A1E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lộc Ấn">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@600;700&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Lộc Ấn App bản 1 · màu và chữ theo bộ nhận diện Lộc Ấn: son, mực, kem, ngà; Spectral + Be Vietnam Pro */
:root{--son:#8E2A1E;--son2:#5E1A12;--muc:#2E2A26;--nhat:#6B625A;--kem:#F7F2E9;--nga:#EDE4D6;--ke:#E6DCCD;--card:#fff;
--ok:#2F7A4B;--okb:#E3F1E7;--bad:#B3261E;--badb:#FBE4E1;--warn:#8A5A00;--warnb:#FFF1D6;--run:#2B5F9E;--runb:#E2ECF8;--vang:#B08A4E;--idle:#D9CFC0}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--kem);color:var(--muc);font:15px/1.45 "Be Vietnam Pro",system-ui,sans-serif;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
.ser{font-family:Spectral,Georgia,serif}
header{position:sticky;top:0;z-index:20;background:var(--son);color:var(--kem);padding:calc(12px + env(safe-area-inset-top)) 16px 14px}
.hr{display:flex;justify-content:space-between;align-items:center;gap:10px;max-width:720px;margin:0 auto}
.brand{font-family:Spectral,serif;font-size:21px;font-weight:700;letter-spacing:.4px}
.sub{font-size:12.5px;opacity:.9}
.ib{width:44px;height:44px;border-radius:22px;border:1.5px solid rgba(247,242,233,.5);background:transparent;color:var(--kem);display:grid;place-items:center;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-width:720px;margin:12px auto 0}
.st{background:rgba(247,242,233,.14);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;border:0;text-align:left;cursor:pointer;color:var(--kem)}
.st b{font-family:Spectral,serif;font-size:28px;line-height:1.1}.st span{font-size:12px}
.st.hot{background:var(--kem);color:var(--bad)}
main{max-width:720px;margin:0 auto;padding:14px 14px calc(120px + env(safe-area-inset-bottom))}
h2{font-family:Spectral,serif;font-size:19px;color:var(--son);margin:0}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:4px 0 10px}
.mut{font-size:12px;color:var(--nhat)}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}
.chip{flex:none;min-height:36px;padding:4px 14px;border-radius:999px;border:1px solid var(--ke);background:#fff;font-size:13px;font-weight:600;cursor:pointer}
.chip[aria-pressed=true]{background:var(--son);border-color:var(--son);color:var(--kem)}
.card{background:#fff;border:1px solid var(--ke);border-radius:14px;padding:12px;margin-bottom:10px}
.ord{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:#fff;border:1px solid var(--ke);border-radius:14px;padding:10px;margin-bottom:10px;cursor:pointer}
.ord:focus-visible,.chip:focus-visible,.tab:focus-visible{outline:2px solid var(--vang);outline-offset:2px}
.th{width:60px;height:60px;flex:none;border-radius:10px;background:var(--nga);display:grid;place-items:center;color:var(--muc);overflow:hidden}.th img{width:100%;height:100%;object-fit:cover;display:block}.th.ini{color:#fff;font-weight:700;font-size:15px;letter-spacing:.5px}.th.s28{width:28px;height:28px;border-radius:6px;font-size:10px}.th.s44{width:44px;height:44px;border-radius:9px;border:1.5px solid rgba(247,242,233,.6)}
.om{flex:1;display:flex;flex-direction:column;gap:2px}
.om b{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.om small{font-size:12.5px;color:var(--nhat);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
.tag{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--nga);white-space:nowrap}
.t-bad{background:var(--badb);color:var(--bad)}.t-warn{background:var(--warnb);color:var(--warn)}.t-ok{background:var(--okb);color:var(--ok)}.t-run{background:var(--runb);color:var(--run)}.t-idle{background:var(--nga);color:var(--nhat)}.t-gh{background:#EEE5F8;color:#5B3A8C}
.ring{width:56px;height:56px;flex:none;position:relative}.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:700}
.empty{color:var(--nhat);text-align:center;padding:24px 0}
/* tiến độ */
.bars{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px;align-items:end;height:84px}
.bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:84px}
.bar i{display:block;width:100%;border-radius:4px 4px 0 0;background:var(--son)}
.bar b{font-size:12px}
.bl{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px;border-top:1px solid var(--ke);padding-top:4px}
.bl span{font-size:10px;color:var(--nhat);text-align:center;line-height:1.2}
.board{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;margin:0 -14px;padding-left:14px;padding-right:14px}
.col{width:176px;flex:none;background:var(--nga);border-radius:14px;padding:10px;scroll-snap-align:start;align-self:flex-start}
.col h3{font-size:13.5px;margin:0 0 8px;color:var(--son);display:flex;justify-content:space-between;gap:6px}
.kc{width:100%;text-align:left;background:#fff;border:0;border-radius:10px;border-top:4px solid var(--ok);padding:8px;margin-bottom:8px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.kc b{font-size:13px;line-height:1.25}.kc .kf{display:flex;justify-content:space-between;align-items:center;gap:4px}
.av{width:28px;height:28px;border-radius:14px;background:var(--muc);color:var(--kem);font-size:11px;font-weight:700;display:grid;place-items:center;flex:none}
/* gantt */
.gh{display:flex;gap:8px;margin-bottom:4px}.gh .lab{width:136px;flex:none}
.gx{flex:1;position:relative;height:16px}.gx span{position:absolute;font-size:11px;color:var(--nhat);transform:translateX(-2px);white-space:nowrap}
.gw{position:relative}
.gr{display:flex;gap:8px;align-items:center;min-height:42px;width:100%;background:none;border:0;padding:0;text-align:left;cursor:pointer}
.gr .lab{width:136px;flex:none;display:grid;grid-template-columns:28px minmax(0,1fr);column-gap:6px;align-items:center}.gr .lab .th{grid-row:1/3}.gr .lab b{font-size:12.5px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.gr .lab small{font-size:11px;font-weight:600}
.gt{flex:1;position:relative;height:22px;background:var(--kem);border-radius:6px}
.gb{position:absolute;top:0;bottom:0;border-radius:6px;border:1.5px solid var(--nga);overflow:hidden;background:var(--nga)}.gb i{display:block;height:100%;background:var(--son)}
.today{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--muc);pointer-events:none}
table{width:100%;border-collapse:collapse;font-size:13px}th{font-size:11.5px;color:var(--nhat);font-weight:600;text-align:left;padding:4px 0;border-bottom:1px solid var(--ke)}
td{padding:8px 4px 8px 0;border-bottom:1px solid var(--nga);vertical-align:top}td.n{white-space:nowrap;font-weight:700}
/* thu chi */
.hero{background:var(--son);color:var(--kem);border-radius:16px;padding:14px;margin-bottom:12px}
.hero b{font-family:Spectral,serif;font-size:32px;line-height:1.1;display:block}
.t3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}.t3 div{background:rgba(247,242,233,.14);border-radius:10px;padding:7px 9px}.t3 span{display:block;font-size:11.5px;opacity:.9}.t3 b{font-family:inherit;font-size:15px}
.ln{display:flex;flex-direction:column;gap:3px;margin-top:9px;width:100%;background:none;border:0;padding:0;text-align:left;cursor:pointer}
.ln .lt{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12.5px}.ln .lt>span:first-child{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:8px}
.ln .lr{display:flex;gap:6px;align-items:center;flex:none}
.trk{height:8px;border-radius:4px;background:var(--nga)}.trk i{display:block;height:100%;border-radius:4px}
/* chi tiết */
.sheet{position:fixed;inset:0;z-index:40;background:var(--kem);overflow-y:auto;-webkit-overflow-scrolling:touch}
@keyframes nhay{0%,45%{box-shadow:0 0 0 3px var(--vang)}100%{box-shadow:0 0 0 0 transparent}}.nhay{animation:nhay 2.6s ease-out}
.sh{position:sticky;top:0;z-index:2;background:var(--son);color:var(--kem);display:flex;gap:10px;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
.back{width:44px;height:44px;border-radius:22px;border:0;background:var(--kem);color:var(--son);display:grid;place-items:center;cursor:pointer;flex:none}
.metro{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));row-gap:12px}
.mt{display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.mt::before{content:"";position:absolute;top:10px;left:0;right:0;height:2px;background:var(--ln,var(--ke))}
.mt i{position:relative;width:22px;height:22px;border-radius:11px;border:2px solid var(--idle);background:#fff;font-style:normal;font-size:11px;font-weight:700;color:#fff;display:grid;place-items:center}
.mt.x i{background:var(--ok);border-color:var(--ok)}.mt.c i{background:var(--son);border-color:var(--son)}.mt.t i{background:var(--bad);border-color:var(--bad)}
.mt span{font-size:10.5px;text-align:center;line-height:1.2;color:var(--nhat)}.mt.c span,.mt.t span{color:var(--muc);font-weight:700}
.sl{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:2px 10px;padding:8px 0;border-bottom:1px solid var(--nga);font-size:13px}
.sl i{grid-row:1/3;width:12px;height:12px;border-radius:6px;margin-top:4px;background:var(--idle)}
.sl small{grid-column:2;color:var(--nhat);font-size:12px}
.docs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.doc{background:#fff;border:1px solid var(--ke);border-radius:10px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
.doc em{font-style:normal;width:30px;height:36px;border-radius:5px;background:var(--idle);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.doc.y em{background:var(--son)}.doc b{font-size:11px;line-height:1.2}.doc small{font-size:10.5px;font-weight:700}
details summary{cursor:pointer;font-weight:600;color:var(--son);min-height:32px}
details p{white-space:pre-wrap;font-size:13px;margin:6px 0 0;overflow-wrap:anywhere}
/* tab dưới */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--son);padding:8px max(10px,env(safe-area-inset-right)) 8px max(10px,env(safe-area-inset-left));border-bottom:calc(16px + env(safe-area-inset-bottom)) solid var(--son2);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.tab{min-height:56px;border-radius:12px;border:1.5px solid rgba(247,242,233,.4);background:transparent;color:var(--kem);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12.5px;font-weight:600;cursor:pointer}
.tab[aria-current=page]{background:var(--kem);color:var(--son);border-color:var(--kem);font-weight:700}
/* đăng nhập */
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--son);color:var(--kem)}
.login form{width:min(360px,100%);display:flex;flex-direction:column;gap:12px}
.login input{min-height:48px;border-radius:12px;border:0;padding:0 14px;font-size:16px;color:var(--muc)}
.login button{min-height:48px;border-radius:12px;border:0;background:var(--kem);color:var(--son);font-weight:700;font-size:16px;cursor:pointer}
.err{background:var(--badb);color:var(--bad);border-radius:10px;padding:8px 10px;font-size:13.5px;font-weight:600}
.load{padding:40px 0;text-align:center;color:var(--nhat)}
@media (prefers-reduced-motion:no-preference){.ord,.kc,.chip{transition:background-color .15s}}
/* Tìm kiếm */
.sbtn{display:flex;align-items:center;gap:10px;width:100%;max-width:720px;margin:12px auto 0;background:var(--kem);color:var(--nhat);border:0;border-radius:12px;padding:12px 14px;font-size:15px;text-align:left;cursor:pointer}
.sbtn svg{flex:none;color:var(--son)}
.sov{position:fixed;inset:0;z-index:90;background:var(--kem);display:flex;flex-direction:column}
.sov[hidden]{display:none}
.stop{background:var(--son);padding:calc(10px + env(safe-area-inset-top)) 12px 12px;display:flex;gap:8px;align-items:center}
.sbox{flex:1;display:flex;align-items:center;gap:8px;background:#fff;border-radius:12px;padding:0 12px}
.sbox input{flex:1;border:0;outline:0;font-size:17px;padding:12px 0;background:transparent;min-width:0}
.sbox button{border:0;background:var(--nga);width:26px;height:26px;border-radius:13px;font-size:14px;color:var(--muc)}
.sx{border:0;background:transparent;color:var(--kem);font-size:15px;font-weight:600;padding:10px 4px}
.sbody{flex:1;overflow:auto;padding:12px 14px calc(24px + env(safe-area-inset-bottom));max-width:720px;width:100%;margin:0 auto}
.cd{margin:0 0 10px;scroll-margin-top:64px}
.cdi{display:flex;align-items:center;gap:8px;border:1px solid var(--ke);border-radius:10px;background:#fff;padding:0 10px}
.cdi:focus-within{border-color:var(--son)}
.cdi input{flex:1;min-width:0;border:0;outline:0;background:transparent;padding:10px 0;font-size:16px;color:var(--muc)}
.cdi .cdo{border:0;background:none;color:var(--nhat);font-size:13px;padding:6px 0 6px 6px}
.cdl{margin-top:6px;border:1px solid var(--ke);border-radius:10px;background:#fff;max-height:46vh;overflow-y:auto;-webkit-overflow-scrolling:touch;box-shadow:0 6px 18px rgba(46,42,38,.10)}
.cdl button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--nga);background:#fff;padding:9px 12px;font-size:14px;color:var(--muc);cursor:pointer}
.cdl button:last-child{border-bottom:0}
.cdl button b{display:block;font-weight:600}
.cdl button small{display:block;color:var(--nhat);font-size:12px;margin-top:2px}
.cdl button small .tag{font-size:10.5px;padding:0 6px;margin-right:4px}
.cdl button.on{background:var(--okb)}
.cdl .cdx{color:var(--son);font-weight:600}
.nfadd{display:flex;align-items:center;gap:8px;width:100%;border:1px dashed var(--son);background:#fff;color:var(--son);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:600;margin:0 0 6px;cursor:pointer}
.nfadd i{font-style:normal;display:grid;place-items:center;width:24px;height:24px;border-radius:12px;background:var(--son);color:var(--kem);font-size:17px;line-height:1}
.schips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 14px}
.schips button{border:1px solid var(--ke);background:#fff;border-radius:999px;padding:7px 12px;font-size:13.5px;color:var(--muc)}
.sh3{font-size:12px;font-weight:700;color:var(--nhat);text-transform:uppercase;letter-spacing:.04em;margin:6px 0 8px}
.sr{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:0;border-radius:12px;padding:10px;margin-bottom:8px;cursor:pointer}
.sr .th{width:48px;height:48px}
.sr b{display:block;font-size:15px}.sr small{display:block;font-size:12.5px;color:var(--nhat);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr mark{background:#F6E3B4;color:inherit;border-radius:3px;padding:0 1px}
.sr .tags{margin-top:4px}
/* Hồ sơ OneDrive */
.dkh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px}.dkh>span{font-size:11px;font-weight:700;color:var(--nhat);text-transform:uppercase;letter-spacing:.05em}.dkh>span small{display:block;text-transform:none;letter-spacing:0;font-weight:500;font-size:11.5px;margin-top:2px}.dkh>b{text-align:right;color:var(--son);font-size:16px;font-weight:800;white-space:nowrap}.dkh>b small{display:block;font-size:10.5px;font-weight:600;color:var(--warn)}.dkls{background:var(--kem);border-radius:12px;padding:2px 11px}.dki{display:flex;gap:10px;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--ke)}.dki:last-child{border-bottom:0}.dkl{min-width:0;flex:1}.dkl b{display:block;font-size:14px;line-height:1.35}.dkl small{display:block;font-size:12.5px;line-height:1.45;color:var(--muc);margin-top:1px}.dkl em{display:inline-block;margin-top:3px;font-style:normal;font-size:11px;font-weight:700;color:var(--run);background:#E8EFF8;border-radius:6px;padding:1px 7px}.dkr{flex:none;text-align:right;font-weight:700;font-size:14px;white-space:nowrap}.dkr small{display:block;font-size:11px;font-weight:500;color:var(--nhat)}.dkr.dkth{color:var(--warn);font-weight:600;font-size:12.5px}.dks{margin-top:6px}.dkg{display:block;font-style:normal;font-size:11.5px;line-height:1.4;color:var(--ok);margin-top:3px}.dkg::before{content:'⚙ tự tính · '}.dkg.w{color:var(--warn)}.dkg.w::before{content:'⚠ '}.dkn{margin:6px 0 0;font-size:12px;color:var(--warn)}.ctr i{font-style:normal;font-weight:500;font-size:11.5px;color:var(--nhat)}
.mds{position:fixed;inset:0;z-index:95;background:rgba(30,15,10,.45);display:flex;align-items:flex-end;justify-content:center}.mds[hidden]{display:none}
.mdsb{background:#fff;width:100%;max-width:560px;max-height:78vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
.mdsx{border:1px solid var(--ke);background:#fff;border-radius:10px;padding:7px 12px;font-weight:600;color:var(--muc);cursor:pointer}
.upb{display:inline-flex;align-items:center;gap:6px;background:var(--son);color:var(--kem);border:0;border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;font-size:14px}
.upb input{display:none}
.subsel{width:100%;margin:6px 0 10px;padding:9px 10px;border:1px solid var(--ke);border-radius:10px;background:#fff;font-size:14px}
.fl{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--ke)}
.fl:first-of-type{border-top:0}
.fi{width:44px;height:44px;border-radius:8px;background:var(--nga);display:grid;place-items:center;overflow:hidden;font-size:10px;font-weight:700;color:var(--son)}
.fi img{width:100%;height:100%;object-fit:cover}
.fl b{display:block;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fl small{display:block;font-size:11.5px;color:var(--nhat);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fa{display:flex;gap:6px}
.fa button{border:1px solid var(--ke);background:#fff;border-radius:9px;padding:7px 10px;font-size:13px;font-weight:600;color:var(--son);cursor:pointer}
.fa .fx{color:var(--bad)}
.upr{background:var(--kem);border-radius:10px;padding:8px 10px;margin-bottom:8px;font-size:13px}
.upr .trk{height:8px;margin-top:5px}
.upr.er{background:var(--badb);color:var(--bad)}
.grp{font-size:11.5px;font-weight:700;color:var(--nhat);text-transform:uppercase;letter-spacing:.04em;margin:12px 0 2px}
.lbx{position:fixed;inset:0;z-index:120;background:rgba(20,16,14,.92);display:grid;place-items:center;padding:20px}
.lbx img{max-width:100%;max-height:80vh;border-radius:10px;background:#fff}
.lbx button{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;width:42px;height:42px;border-radius:21px;border:0;background:var(--kem);font-size:18px}
/* Hộp thư đến + thông báo */

  else if (t.hasAttribute('data-reload')) { lamMoiTatCa(); return; }
  render();
});
document.addEventListener('submit', (e) => { e.preventDefault(); if (e.target.id === 'f-login') { const c = ($('#code').value || '').trim(); if (c) load(c); } });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && S.open) { S.open = null; render(); } });
document.addEventListener('visibilitychange', () => { if (document.visibilityState !== 'visible' || !S.data || !S.code) return; if (PICK.luc && Date.now() - PICK.luc < 120000) return; if (Date.now() - (S.kiemLuc || 0) > 600000) kiemBanMoi(); load(S.code); layMoCho().then((m) => { if (m) moTB(m); }); });
/* Nút làm mới: nạp bản app mới nếu có, lấy số liệu mới nhất (bỏ qua bộ nhớ 60 giây của máy chủ), làm mới hồ sơ đơn đang mở và hộp thư đến */
async function lamMoiTatCa() {
  if (S.busy) return;
  if (await kiemBanMoi()) return;
  load(S.code, true);
  if (S.open) hsLoad(S.open, true, true);
  hopLoad(false); tbTai();
}
async function kiemBanMoi() {
  S.kiemLuc = Date.now();
  try {
    const t = await fetch('./?v=' + Date.now(), { cache: 'no-store' }).then((r) => r.text()), m = t.match(/const APP_VER = '([^']+)'/);
    if (m && m[1] !== APP_VER) { toast('Có bản app mới, đang cập nhật…'); setTimeout(() => { try { if (S.open) sessionStorage.setItem('la-dich', JSON.stringify({ luc: Date.now(), g: S.dich && S.dich.g.ma === S.open ? S.dich.g : { ma: S.open, so: BP.ma === S.open ? BP.so : 0, muc: '' } })); } catch (e) {} location.reload(); }, 400); return true; }
  } catch (e) {}
  return false;
}
function toast(msg) {
  let el = document.getElementById('toast'); if (!el) { el = document.createElement('div'); el.id = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
  el.textContent = msg; el.className = 'show'; clearTimeout(toast.t); toast.t = setTimeout(() => { el.className = ''; }, 2200);
}
if (S.code) load(S.code); else render();
}
</script>
